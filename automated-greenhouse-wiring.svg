<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680">
  <rect width="1100" height="680" fill="#f8fafc"/>
  <style>
    .box{fill:#ffffff;stroke:#0f172a;stroke-width:3;rx:18;}
    .title{font:700 24px Arial, sans-serif;fill:#0f172a;}
    .text{font:500 18px Arial, sans-serif;fill:#334155;}
    .pin{font:700 17px Arial, sans-serif;fill:#0f172a;}
    .wire{fill:none;stroke-width:5;stroke-linecap:round;}
    .label{font:700 16px Arial, sans-serif;fill:#0f172a;}
  </style>
  <text x="550" y="55" text-anchor="middle" class="title">Otomatik Sera Sulama Sistemi - Temel Bağlantı Şeması</text>
  <rect x="420" y="130" width="260" height="360" class="box"/>
  <text x="550" y="170" text-anchor="middle" class="title">Arduino Uno</text>
  <text x="455" y="230" class="pin">5V</text><text x="455" y="280" class="pin">GND</text><text x="455" y="330" class="pin">A4 / SDA</text><text x="455" y="380" class="pin">A5 / SCL</text><text x="455" y="430" class="pin">D7</text>
  <rect x="90" y="145" width="240" height="220" class="box"/>
  <text x="210" y="185" text-anchor="middle" class="title">DS3231 RTC</text>
  <text x="125" y="235" class="pin">VCC</text><text x="125" y="275" class="pin">GND</text><text x="125" y="315" class="pin">SDA</text><text x="125" y="355" class="pin">SCL</text>
  <rect x="780" y="170" width="240" height="210" class="box"/>
  <text x="900" y="210" text-anchor="middle" class="title">Röle Modülü</text>
  <text x="815" y="260" class="pin">VCC</text><text x="815" y="300" class="pin">GND</text><text x="815" y="340" class="pin">IN</text>
  <rect x="780" y="485" width="240" height="110" class="box"/>
  <text x="900" y="530" text-anchor="middle" class="title">Pompa / Vana</text><text x="900" y="565" text-anchor="middle" class="text">Harici güç ile beslenir</text>
  <path d="M330 235 C380 235 380 230 420 230" class="wire" stroke="#ef4444"/><text x="365" y="220" class="label">5V</text>
  <path d="M330 275 C380 275 380 280 420 280" class="wire" stroke="#111827"/><text x="355" y="300" class="label">GND</text>
  <path d="M330 315 C380 315 380 330 420 330" class="wire" stroke="#2563eb"/><text x="350" y="350" class="label">SDA</text>
  <path d="M330 355 C380 355 380 380 420 380" class="wire" stroke="#16a34a"/><text x="350" y="405" class="label">SCL</text>
  <path d="M680 230 C725 230 735 260 780 260" class="wire" stroke="#ef4444"/><text x="708" y="218" class="label">5V</text>
  <path d="M680 280 C725 280 735 300 780 300" class="wire" stroke="#111827"/><text x="700" y="305" class="label">GND</text>
  <path d="M680 430 C730 430 735 340 780 340" class="wire" stroke="#f59e0b"/><text x="705" y="405" class="label">D7 → IN</text>
  <path d="M900 380 L900 485" class="wire" stroke="#64748b"/><text x="925" y="435" class="label">COM/NO</text>
  <text x="550" y="635" text-anchor="middle" class="text">Not: Pompa/Vanayı Arduino 5V pininden doğrudan besleme; uygun harici güç kaynağı kullan.</text>
</svg>
